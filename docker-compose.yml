services:
  resumeai:
    build: .
    image: resumeai:local
    container_name: resumeai
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      # Per-run rendered outputs on the host. The orchestrator + the
      # /runs/<id>/pdf route both resolve ``runs/<run_id>/...`` relative
      # to the process cwd (= /app inside the container), so the mount
      # target MUST be ``/app/runs`` -- mounting somewhere else
      # silently puts PDFs in an unbind-mounted spot and the download
      # route 404s.
      - ./runs:/app/runs
      # The candidate's context tree (resume.yaml, work_history/, projects/,
      # master-resume.txt, Resume*.tex). The orchestrator reads it via
      # ``DEFAULT_CONTEXT_ROOT = Path("UserContext")`` -- relative, so
      # same /app-rooted path applies.
      - ./UserContext:/app/UserContext
      # The SQLite database that holds Settings + Run history + Context-pool
      # uploads. Bind-mounting the host's ``~/.resumeai/`` so the container
      # shares the SAME database the user already has on their Mac --
      # otherwise the context pool the user uploaded pre-Docker looks empty.
      - ${HOME}/.resumeai:/root/.resumeai

      # Claude CLI auth. The host keychain isn't readable from the container,
      # so we project the OAuth token into a file the CLI reads on startup.
      # Run ``./Tools/export-claude-credentials.sh`` once before
      # ``docker compose up`` to populate ./_docker_claude/.credentials.json.
      - ./_docker_claude:/root/.claude
