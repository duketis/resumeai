services:
  resumeai:
    build: .
    image: resumeai:local
    container_name: resumeai
    restart: unless-stopped
    ports:
      - "8765:8765"
    env_file:
      # Holds CLAUDE_CODE_OAUTH_TOKEN -- the long-lived Max-subscription
      # token generated once via ``claude setup-token`` on the host.
      # Gitignored. See README/CLAUDE.md for the one-time setup flow.
      - .env
    environment:
      # The ``claude`` CLI inside the container reads this env var as its
      # auth source -- no keychain, no OAuth refresh, no expiry. Same Max
      # subscription as the host. Mirrors the algo/dashboard pattern.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      # Root the loader's project-folder scanner against the mounted
      # host directory below. ``local_path`` values in
      # ``UserContext/projects/<slug>.md`` resolve relative to this.
      - RESUMEAI_PROJECTS_ROOT=/host/personal
      # Maps absolute host paths in API requests (the user-facing paths
      # they see in Finder / their shell) to the in-container mount
      # above. Without this, jobai's proxy posts
      # ``/Users/jonathan/Documents/personal/jobai`` and the scanner
      # 404s because that path doesn't exist inside the container.
      - RESUMEAI_HOST_ROOT=${HOME}/Documents/personal
    volumes:
      # Per-run rendered outputs on the host. The orchestrator + the
      # /runs/<id>/pdf route both resolve ``runs/<run_id>/...`` relative
      # to the process cwd (= /app inside the container), so the mount
      # target MUST be ``/app/runs``.
      - ./runs:/app/runs
      # The candidate's context tree (resume.yaml, work_history/, projects/,
      # master-resume.txt, Resume*.tex). The orchestrator reads it via
      # ``DEFAULT_CONTEXT_ROOT = Path("UserContext")`` -- relative, so
      # same /app-rooted path applies.
      - ./UserContext:/app/UserContext
      # The SQLite database that holds Settings + Run history + Context-pool
      # uploads. Bind-mounting the host's ``~/.resumeai/`` so the container
      # shares the SAME database the user already has on their Mac.
      - ${HOME}/.resumeai:/root/.resumeai
      # The user's personal projects (jobai, algo/Strategy Miner, ...).
      # The loader's recursive scanner reads from here when a project's
      # ``.md`` frontmatter sets ``local_path: <relative-folder>``.
      # Read-only -- nothing in resumeai writes to your other repos.
      - ${HOME}/Documents/personal:/host/personal:ro
