<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}resumeai{% endblock %}</title>
  {% block extra_head %}{% endblock %}
  <style>
    :root {
      --fg: #1a1a1a;
      --muted: #5f6368;
      --accent: #1a73e8;
      --accent-dark: #1557b0;
      --good: #0a7c2f;
      --warn: #b06000;
      --danger: #d93025;
      --bg-card: #f8f9fa;
      --border: #dadce0;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 760px;
      margin: 0 auto;
      padding: 2em 1.2em;
      color: var(--fg);
      line-height: 1.5;
    }
    header h1 { font-size: 1.8em; margin: 0 0 0.2em; }
    header .tagline { color: var(--muted); margin: 0 0 2em; }
    h2 { font-size: 1.2em; margin: 2em 0 0.6em; padding-top: 1em; border-top: 1px solid var(--border); }
    h2:first-of-type { border-top: none; padding-top: 0; }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1em 1.4em;
      margin: 0.8em 0;
    }
    .status-good { color: var(--good); font-weight: 600; }
    .status-warn { color: var(--warn); font-weight: 600; }
    button, .button {
      background: var(--accent);
      color: white;
      padding: 0.55em 1.3em;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95em;
      font-weight: 500;
      text-decoration: none;
      display: inline-block;
      margin-top: 0.6em;
    }
    button:hover, .button:hover { background: var(--accent-dark); }
    button.danger, .button.danger { background: var(--danger); }
    button.secondary, .button.secondary { background: white; color: var(--accent); border: 1px solid var(--border); }
    textarea {
      width: 100%;
      min-height: 180px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.85em;
      padding: 0.6em;
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.55em 0.7em;
      font-size: 0.95em;
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    code { background: #eef1f5; padding: 0.12em 0.4em; border-radius: 3px; font-size: 0.9em; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    ol.steps { padding-left: 1.4em; }
    ol.steps li { margin-bottom: 1em; }
    .nav { margin-bottom: 1.6em; }
    .nav a { margin-right: 1.2em; }
    .flash {
      background: #e6f4ea;
      border: 1px solid #a8d5b9;
      color: var(--good);
      padding: 0.7em 1em;
      border-radius: 4px;
      margin-bottom: 1.4em;
    }
    .flash.error {
      background: #fce8e6;
      border-color: #f28b82;
      color: var(--danger);
    }
  </style>
</head>
<body>
  <header>
    <h1>resumeai</h1>
    <p class="tagline">AI-driven resume tailoring, powered by your master Google Doc.</p>
    <nav class="nav">
      <a href="/tailor">Tailor</a>
      <a href="/runs">Runs</a>
      <a href="/settings">Settings</a>
      <a href="/onboarding">Onboarding</a>
    </nav>
  </header>
  <main>
    {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
