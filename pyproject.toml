[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resumeai"
version = "0.4.0"
description = "AI-driven resume tailoring service: reads a job description and your full career context, then drives a Google Docs template into a tailored resume."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jonathan Duketis" }]
requires-python = ">=3.12"
keywords = ["resume", "ai", "agent", "google-docs", "fastapi", "claude", "mcp"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx[http2]>=0.27,<1.0",
  "selectolax>=0.3.21",
  "pydantic>=2.5,<3.0",
  "pydantic-settings>=2.1,<3.0",
  "structlog>=24.1",
  "typer>=0.12,<1.0",
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0,<3.0",
  "google-api-python-client>=2.120",
  "google-auth>=2.28",
  "google-auth-httplib2>=0.2",
  "mcp>=1.0",
  "sse-starlette>=2.0",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "pytest-mock>=3.12",
  "respx>=0.20",
  "mypy>=1.8",
  "ruff>=0.3",
  "types-pyyaml",
  "pre-commit>=3.6",
]

[project.scripts]
resumeai = "resumeai.cli:app"

[project.urls]
Repository = "https://github.com/duketis/resumeai"
Issues = "https://github.com/duketis/resumeai/issues"

[tool.setuptools.packages.find]
include = ["resumeai*"]
exclude = ["tests*", "_private*", "UserContext*"]

[tool.setuptools.package-data]
resumeai = ["py.typed"]

# ---------------------------------------------------------------------------
# Ruff — lint and format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["_private", "UserContext", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "N",      # pep8-naming
  "UP",     # pyupgrade
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "S",      # flake8-bandit
  "BLE",    # flake8-blind-except
  "RET",    # flake8-return
  "SIM",    # flake8-simplify
  "PTH",    # flake8-use-pathlib
  "PL",     # pylint
  "TRY",    # tryceratops
  "ASYNC",  # flake8-async
  "RUF",    # ruff-specific
]
ignore = [
  "PLR0913",  # too many args (sometimes intentional)
  "TRY003",   # long exception messages
  "PLR2004",  # magic numbers (handled per-file in tests)
  # En-dash/em-dash unicode chars are intentional in prose and in
  # parsed JD / resume text that comes from real-world sources.
  "RUF001",   # ambiguous unicode in string literals
  "RUF002",   # ambiguous unicode in docstrings
  "RUF003",   # ambiguous unicode in comments
]

[tool.ruff.lint.per-file-ignores]
# S105/S106/S107: test fixtures use obviously fake credential strings;
# the security check is high-noise on test code.
"tests/**/*.py" = ["S101", "PLR2004", "ANN", "PLR0915", "S105", "S106", "S107"]

[tool.ruff.lint.flake8-bugbear]
# Typer's `param: T = typer.Option(...)` and FastAPI's
# `param: T = Depends(...)` / `Form(...)` are the idiomatic patterns; the
# call returns a marker object, not a stateful value, so B008's concerns
# do not apply.
extend-immutable-calls = [
  "typer.Option",
  "typer.Argument",
  "fastapi.Depends",
  "fastapi.Form",
  "fastapi.File",
  "fastapi.Body",
  "fastapi.Query",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Cookie",
  "fastapi.Security",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy — strict static typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
ignore_missing_imports = false
show_error_codes = true
pretty = true
files = ["resumeai", "tests"]
exclude = ["_private/", "UserContext/", "build/", "dist/"]

[[tool.mypy.overrides]]
# Google API client packages don't ship py.typed markers / type stubs.
module = ["googleapiclient.*", "google.oauth2.*", "google.auth.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Calls into google.oauth2.credentials.Credentials() are untyped at the
# library level. Suppress the strict-mode "no-untyped-call" only there.
module = ["resumeai.docs.client"]
disallow_untyped_calls = false

# ---------------------------------------------------------------------------
# pytest — testing
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
markers = [
  "slow: marks tests as slow (deselect with -m 'not slow')",
  "integration: integration tests (may touch network or filesystem)",
]
filterwarnings = [
  "error",
  "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["resumeai"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_also = [
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@overload",
]
